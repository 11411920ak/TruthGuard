version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:////app/data/truthguard.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://127.0.0.1:3000
      - SECRET_KEY=${SECRET_KEY:-truthguard-super-secret-key-prod-change-me}
      - AI_API_KEY=${AI_API_KEY:-}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
    volumes:
      - truthguard-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - truthguard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - truthguard-network

volumes:
  truthguard-data:
    name: truthguard-data

networks:
  truthguard-network:
    name: truthguard-network
    driver: bridge
